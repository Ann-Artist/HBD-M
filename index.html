<!-- BIRTHDAY SURPRISE -->
<section id="birthday" class="view">
  <div id="floaters"></div>
  <button class="back" id="bdayBack">&larr; Back to results</button>
  <div class="bday-inner">
    <div class="hero">
      <h2 id="bTitle"></h2>
      <p id="bSub"></p>
    </div>
    <div class="cake-zone reveal">
      <div class="cake" id="cake">
        <div class="candles"></div>
        <div class="tier t1"></div><div class="tier t2">&#10084;</div>
        <div class="plate"></div>
      </div>
      <button class="gbtn" id="wishBtn">Make a wish</button>
      <p class="wish" id="wishMsg"></p>
    </div>
    <div id="bPhotos"></div>
    <div class="letter reveal" id="letter"></div>
  </div>
</section>

<canvas id="confetti"></canvas>

<!-- LIGHTBOX MODAL (No Captions) -->
<div class="modal" id="lightbox">
  <button class="x" data-close aria-label="Close">&times;</button>
  <button class="nav prev" aria-label="Previous">&#8249;</button>
  <figure class="lightbox-figure">
    <div class="lightbox-media">
      <img alt="Mummy Photo" src="">
    </div>
    <div class="lightbox-meta">
      <span class="lb-counter"></span>
    </div>
  </figure>
  <button class="nav next" aria-label="Next">&#8250;</button>
</div>
